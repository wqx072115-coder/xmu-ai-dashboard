<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XMU AI 毕业仪表盘 · 厦门大学人工智能专硕 (085410)</title>
<style>
:root{
  --bg:#f2f5f9; --card:#ffffff; --ink:#16202c; --muted:#66788d; --line:#e3e9f1;
  --brand:#1f6fb2; --brand-2:#0d3b66; --accent:#c9a227; --ok:#2e7d4f; --warn:#b3452f;
  --blue:#1f6fb2; --navy:#0d3b66; --gold:#c9a227; --gray:#94a3b8;
  --shadow:0 4px 18px rgba(13,59,102,.07); --radius:14px;
  --c-pub:#1f6fb2; --c-req:#0d3b66; --c-ele:#2e9e6b; --c-tra:#c9a227;
}
[data-theme="dark"]{
  --bg:#0e141c; --card:#161f2b; --ink:#e7eef6; --muted:#8ea0b5; --line:#263242;
  --brand:#3d8fd4; --brand-2:#6aa5d8; --accent:#d8b64a; --ok:#4caf7d; --warn:#e0765a;
  --blue:#3d8fd4; --navy:#8fb6dd; --gold:#d8b64a; --gray:#64748b;
  --shadow:0 4px 18px rgba(0,0,0,.35);
  --c-pub:#3d8fd4; --c-req:#7f9fc0; --c-ele:#4caf7d; --c-tra:#d8b64a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
button{font-family:inherit}
.icon{display:inline-block;width:16px;height:16px;vertical-align:-2px;margin-right:5px}

/* ===== Topbar ===== */
.topbar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 20px;flex-wrap:wrap}
.topbar .brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-weight:800;color:var(--navy)}
.topbar .brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.topbar .brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);line-height:1.1}
.tbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;transition:.15s}
.tbtn:hover{border-color:var(--brand);color:var(--brand)}
.tbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.tbtn.primary:hover{background:var(--brand-2)}

/* ===== Tabs ===== */
.tabs{display:flex;gap:6px;padding:14px 20px 0;max-width:1280px;margin:0 auto;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;transition:.15s;font-weight:600}
.tab:hover{color:var(--brand)}
.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}

/* ===== Layout ===== */
main{max-width:1280px;margin:0 auto;padding:18px 20px 90px}
.panel{display:none}
.panel.active{display:block}
.grid{display:grid;gap:16px}
.cols-4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

/* ===== Card ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h3{font-size:16px;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h3 .hint{font-size:12px;font-weight:500;color:var(--muted)}

/* ===== Summary cards ===== */
.sum{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;position:relative;overflow:hidden}
.sum .k{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.sum .k .tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
.sum .v{font-size:26px;font-weight:800;color:var(--navy);margin:6px 0 2px}
.sum .v small{font-size:14px;font-weight:600;color:var(--muted)}
.sum .bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;margin-top:8px}
.sum .bar i{display:block;height:100%;border-radius:999px;transition:width .5s ease}
.sum .d{font-size:12px;color:var(--muted);margin-top:6px}

/* ===== Progress ring (total) ===== */
.ringwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{position:relative;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:24px;color:var(--navy);line-height:1}
.ring .c span{font-size:11px;color:var(--muted)}

/* ===== Tables ===== */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--bg);color:var(--navy);font-weight:700;white-space:nowrap;position:sticky;top:0}
tbody tr:hover{background:var(--bg)}
.cred{font-weight:800;color:var(--brand);text-align:center;white-space:nowrap}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.must{background:#fdeaea;color:var(--warn)}
.tag.group{background:#fff3e0;color:#b07d12}
.tag.opt{background:var(--bg);color:var(--muted)}
.tag.two{background:#eaf2fb;color:var(--brand)}
.sel{width:17px;height:17px;accent-color:var(--brand);cursor:pointer;vertical-align:middle}
.search{width:100%;max-width:320px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:13px}

/* ===== Timetable ===== */
.tt-wrap{overflow-x:auto}
.tt{display:grid;grid-template-columns:54px repeat(7,minmax(86px,1fr));gap:3px;min-width:720px}
.tt .hdr{background:var(--bg);color:var(--navy);font-weight:700;text-align:center;padding:8px 2px;border-radius:8px;font-size:13px}
.tt .tcol{background:var(--bg);color:var(--muted);text-align:center;padding:4px 2px;border-radius:8px;font-size:11px;line-height:1.2}
.tt .cell{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:4px;position:relative}
.tt .cell.free-morning{background:rgba(46,158,107,.07);border-color:rgba(46,158,107,.2)}
.tt .cell.free-noon{background:rgba(31,111,178,.06);border-color:rgba(31,111,178,.18)}
.course-block{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.35;cursor:pointer;box-shadow:0 2px 8px rgba(13,59,102,.2);min-height:38px;overflow:hidden}
.course-block .nm{font-weight:700}
.course-block .rm{font-size:11px;opacity:.85}
.course-block[data-color]{background:var(--c)}

/* ===== Milestones ===== */
.mile{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--card)}
.mile .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.mile .nm{font-weight:700;color:var(--navy);font-size:15px}
.mile .cr{font-size:12px;color:var(--brand);font-weight:700;background:var(--bg);padding:2px 10px;border-radius:999px}
.mile .due{font-size:12px;color:var(--muted);margin:4px 0 10px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.step{flex:1;min-width:70px;text-align:center;padding:8px 6px;border-radius:9px;background:var(--bg);font-size:12px;color:var(--muted);cursor:pointer;border:1px solid transparent;transition:.15s}
.step.on{background:var(--brand);color:#fff;font-weight:700}
.step:hover{border-color:var(--brand)}
.counter{display:flex;align-items:center;gap:14px}
.counter .big{font-size:34px;font-weight:800;color:var(--navy);line-height:1}
.counter .lbl{font-size:13px;color:var(--muted)}
.meter{height:10px;border-radius:999px;background:var(--bg);overflow:hidden;flex:1}
.meter i{display:block;height:100%;border-radius:999px;transition:width .4s}

/* ===== Pipeline ===== */
.pipe{display:flex;flex-direction:column;gap:0}
.pipe-item{display:flex;gap:12px;padding:12px 0;border-left:3px solid var(--line);padding-left:18px;position:relative}
.pipe-item:before{content:"";position:absolute;left:-7px;top:18px;width:11px;height:11px;border-radius:50%;background:var(--line)}
.pipe-item.done{border-color:var(--ok)}
.pipe-item.done:before{background:var(--ok)}
.pipe-item.now{border-color:var(--accent)}
.pipe-item.now:before{background:var(--accent);box-shadow:0 0 0 4px rgba(201,162,39,.2)}
.pipe-item .pt{font-weight:700;color:var(--navy)}
.pipe-item .pd{font-size:12.5px;color:var(--muted)}

/* ===== Buttons / chips ===== */
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2)}
.btn.danger{color:var(--warn)}
.btn.danger:hover{border-color:var(--warn);color:var(--warn)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1}
.mt{margin-top:14px}
.mb{margin-bottom:10px}

/* ===== Modal ===== */
.overlay{position:fixed;inset:0;background:rgba(8,16,28,.5);backdrop-filter:blur(2px);z-index:200;display:none;align-items:center;justify-content:center;padding:18px}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:22px}
.modal h3{font-size:17px;color:var(--navy);margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:13.5px;font-family:inherit}
.field textarea{min-height:70px;resize:vertical}
.field .help{font-size:11.5px;color:var(--muted);margin-top:4px}
.mrow{display:flex;gap:10px}
.mrow .field{flex:1}

/* ===== Toast ===== */
#toasts{position:fixed;right:18px;bottom:18px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:320px;animation:pop .25s ease}
.toast.err{background:var(--warn)}
.toast.ok{background:var(--ok)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.disc{font-size:12px;color:var(--muted);margin-top:20px;text-align:center;padding-top:14px;border-top:1px solid var(--line)}
.note{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13.5px}

@media (max-width:640px){.topbar{padding:8px 12px}.tabs{padding:10px 12px 0}main{padding:12px 12px 70px}.card{padding:15px}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="logo">厦</div><div>XMU AI 毕业仪表盘<small>人工智能专硕 085410 · 2026级</small></div></div>
  <button class="tbtn" data-action="export"><span class="icon">⬇</span>导出</button>
  <button class="tbtn" data-action="import"><span class="icon">⬆</span>导入</button>
  <button class="tbtn" data-action="gistUp"><span class="icon">☁</span>Gist 上传</button>
  <button class="tbtn" data-action="gistDown"><span class="icon">☁</span>Gist 下载</button>
  <button class="tbtn" data-action="settings"><span class="icon">⚙</span>设置</button>
  <button class="tbtn" id="themeBtn"><span class="icon">◐</span>主题</button>
  <input type="file" id="fileImport" accept="application/json" style="display:none">
</div>

<div class="tabs">
  <button class="tab active" data-tab="tab1">① 学分与课程</button>
  <button class="tab" data-tab="tab2">② 智能课表</button>
  <button class="tab" data-tab="tab3">③ 培养环节</button>
  <button class="tab" data-tab="tab4">④ 科研与毕业</button>
</div>

<main>
  <!-- ============ Module 1: Credit Hub ============ -->
  <section class="panel active" id="tab1">
    <div class="grid cols-4" id="summary"></div>
    <div class="card mt">
      <h3>总学分进度 <span class="hint">目标 31 = 课程 21 + 培养环节 10</span></h3>
      <div class="ringwrap">
        <div class="ring" id="ring"></div>
        <div class="grow" id="ringLegend"></div>
      </div>
    </div>
    <div class="card mt">
      <h3>课程清单 <span class="hint">勾选 = 已选/已完成；选择自动保存</span></h3>
      <div class="row mb">
        <input class="search" id="courseSearch" placeholder="搜索课程名 / 代码 / 学院…">
        <button class="btn" id="filterAI">只看 AI/信息学院相关</button>
        <button class="btn pri" data-action="addCourse">＋ 添加自定义课程</button>
        <button class="btn" data-action="timeline">📅 选课时间与提示</button>
      </div>
      <div id="courseTables"></div>
    </div>
  </section>

  <!-- ============ Module 2: Schedule ============ -->
  <section class="panel" id="tab2">
    <div class="card">
      <h3>智能课表 <span class="hint" id="weekInfo">第 — 周</span></h3>
      <div class="row mb">
        <button class="btn pri" data-action="addBlock">＋ 添加课程时段</button>
        <button class="btn" data-action="ics">⬇ 导出 .ics 日历</button>
        <button class="btn" data-action="vision">🧠 截图识别导入</button>
        <label class="btn" style="cursor:pointer"><input type="checkbox" id="freeToggle" style="vertical-align:-2px"> 高亮空闲时段</label>
      </div>
      <div class="tt-wrap"><div class="tt" id="timetable"></div></div>
      <div class="disc" id="ttLegend"></div>
    </div>
  </section>

  <!-- ============ Module 3: Milestones ============ -->
  <section class="panel" id="tab3">
    <div class="grid cols-2" id="milestones"></div>
  </section>

  <!-- ============ Module 4: Thesis ============ -->
  <section class="panel" id="tab4">
    <div class="grid cols-2">
      <div class="card">
        <h3>科研小论文 <span class="hint">导师前置审核</span></h3>
        <div class="row mb">
          <button class="btn pri sm" data-action="addPaper">＋ 添加论文/成果</button>
        </div>
        <div id="paperList"></div>
        <div class="note mt" id="paperRule"></div>
      </div>
      <div class="card">
        <h3>论文里程碑清单</h3>
        <div id="paperSteps"></div>
      </div>
      <div class="card">
        <h3>毕业倒计时流程</h3>
        <div class="pipe" id="thesisPipe"></div>
      </div>
      <div class="card">
        <h3>大论文（学位论文/实践成果）要点</h3>
        <div id="thesisRules"></div>
      </div>
    </div>
  </section>
</main>

<!-- Modals -->
<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>
<div id="toasts"></div>

function defMile(t){
  if(t.type==="toggle") return {done:false};
  if(t.type==="steps") return {step:0};
  if(t.type==="practice") return {months:0,report:false,attach:false};
  if(t.type==="teaching") return {done:false,signed:false};
  if(t.type==="lecture") return {count:0,list:[]};
  return {done:false};
}
function deepMerge(base, over){
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  for(const k in over){
    const ov = over[k], bv = base[k];
    if(ov && typeof ov==="object" && !Array.isArray(ov) && bv && typeof bv==="object" && !Array.isArray(bv)){
      out[k] = deepMerge(bv, ov);
    } else {
      out[k] = ov;
    }
  }
  return out;
}
function mergeState(obj){
  const base = JSON.parse(JSON.stringify(DEFAULT_STATE));
  const s = deepMerge(base, obj || {});
  s.version = STATE_VERSION;
  TRAINING.forEach(t=>{ if(!s.milestones[t.id]) s.milestones[t.id] = defMile(t); });
  return s;
}
let state = load();
function load(){
  let raw = null; try{ raw = localStorage.getItem(LS_KEY); }catch(e){}
  let parsed = null; if(raw){ try{ parsed = JSON.parse(raw); }catch(e){} }
  // 升级保护：旧数据版本不一致时，先整体备份到独立键，避免被覆盖丢失
  if(parsed && parsed.version !== STATE_VERSION){
    try{ localStorage.setItem(LS_KEY + "_backup_v" + (parsed.version || "legacy") + "_" + Date.now(), raw); }catch(e){}
  }
  return mergeState(parsed);
}
function save(){ try{ state.version = STATE_VERSION; localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function ensureMile(){ TRAINING.forEach(t=>{ if(!state.milestones[t.id]) state.milestones[t.id]=defMile(t); }); }

function allCourses(){ return C.public.concat(C.required).concat(C.elective); }
function selCredits(cat){
  let sum=0;
  (C[cat]||[]).forEach(c=>{ if(state.courses[c.code]) sum+=c.credit; });
  (state.custom||[]).filter(c=>c.category===cat).forEach(c=>{ if(state.courses[c.id]) sum+=c.credit; });
  return sum;
}
function trainingDoneCredits(){
  return TRAINING.reduce((s,t)=>{
    let done=false; const m=state.milestones[t.id]||defMile(t);
    if(t.type==="toggle") done=!!m.done;
    else if(t.type==="steps") done=(m.step||0)>=t.steps.length;
    else if(t.type==="practice") done=(m.months||0)>=6;
    else if(t.type==="teaching") done=!!m.done;
    else if(t.type==="lecture") done=(m.count||0)>=20;
    return s+(done?t.credit:0);
  },0);
}

function weekNumber(){
  try{
    const start = new Date(state.settings.startDate+"T00:00:00");
    if(isNaN(start)) return null;
    const diff = Math.floor((Date.now()-start.getTime())/(7*86400000));
    return diff>=0 ? diff+1 : null;
  }catch(e){ return null; }
}
function renderSchedule(){
  const w = weekNumber();
  $("#weekInfo").textContent = w ? `第 ${w} 周` : "（请在设置中填写学期起始日期）";
  const free = $("#freeToggle").checked;
  const covered = {};
  state.schedule.forEach(s=>{ for(let p=s.start;p<=s.end;p++){ if(p!==s.start) covered[s.day+"-"+p]=true; } });
  let cells = `<div class="hdr" style="grid-row:1;grid-column:1">节/时间</div>`;
  DAYS.forEach((d,i)=> cells += `<div class="hdr" style="grid-row:1;grid-column:${i+2}">${d}</div>`);
  for(let p=0;p<11;p++){
    cells += `<div class="tcol" style="grid-row:${p+2};grid-column:1">${p+1}<br>${PERIOD_TIMES[p]}</div>`;
    for(let d=0;d<7;d++){
      const blk = state.schedule.find(s=>s.day===d && s.start===p);
      if(blk){
        const span = blk.end-blik.start+1;
        const color = blk.color || "var(--brand)";

            <div class="nm">${esc(blk.name)}</div><div class="rm">${esc(blk.room||"")}</div>

function exportICS(){
  if(!state.schedule.length){ toast("课表为空","err"); return; }
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//XMU AI Dashboard//CN","CALSCALE:GREGORIAN"];
  state.schedule.forEach(s=>{
    const dow = ["MO","TU","WE","TH","FR","SA","SU"][s.day];
    const st = PERIOD_TIMES[s.start].split(":"), en = PERIOD_TIMES[s.end].split(":");
    const sh = parseInt(st[0])+Math.floor((parseInt(st[1])+50)/60), sm = (parseInt(st[1])+50)%60;
    const eh = parseInt(en[0])+Math.floor((parseInt(en[1])+50)/60), em = (parseInt(en[1])+50)%60;
    const dt = new Date(state.settings.startDate+"T00:00:00");
    dt.setDate(dt.getDate() + s.day + (7-((dt.getDay()+6)%7)%7)); // 粗定位到最近对应星期
    const ymd = d => d.toISOString().slice(0,10).replace(/-/g,"");
    lines.push("BEGIN:VEVENT",`UID:${s.id}@xmu`, `DTSTART:${ymd(dt)}T${String(sh).padStart(2,"0")}${String(sm).padStart(2,"0")}00`, `DTEND:${ymd(dt)}T${String(eh).padStart(2,"0")}${String(em).padStart(2,"0")}00`, `RRULE:FREQ=WEEKLY;BYDAY=${dow}`, `SUMMARY:${s.name}`, s.room?`LOCATION:${s.room}`:"", "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")],{type:"text/calendar"});

  $("#v_go").onclick = async ()=>{

function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=()=>rej(new Error("读取失败")); r.readAsDataURL(file); }); }
function extractJSON(s){ const a=s.indexOf("["), b=s.lastIndexOf("]"); if(a>=0&&b>a) return s.slice(a,b+1); return s; }
async function callLLM(imgB64, prompt){
  const {llmBaseUrl,llmApiKey,llmModel} = state.settings;
  const url = llmBaseUrl.replace(/\/+$/,"");
  const body = {
    model: llmModel,
    messages:[{role:"user",content:[
      {type:"text",text:prompt},
      {type:"image_url",image_url:{url:`data:image/png;base64,${imgB64}`}},
    ]}],
    temperature:0,
  };
  const r = await fetch(url+"/chat/completions", {method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+llmApiKey}, body:JSON.stringify(body)});
  if(!r.ok){ const t = await r.text(); throw new Error(t.slice(0,200)); }
  const j = await r.json();
  return j.choices[0].message.content;
}

/* ---- 导出 / 导入 与云同步（密钥绝不上传） ---- */
function sanitize(obj){
  const s = JSON.parse(JSON.stringify(obj));
  if(s.settings){
    delete s.settings.gistToken;   // 绝不外传
    delete s.settings.llmApiKey;   // 绝不外传
  }
  return s;
}
// 合并外部数据（导入 / 云端载入）：若文件不含密钥，则保留本地当前密钥，避免重填
function applyExternal(obj){
  const cur = (state && state.settings) ? state.settings : {};
  const s = mergeState(obj);
  if(!s.settings.llmApiKey && cur.llmApiKey) s.settings.llmApiKey = cur.llmApiKey;
  if(!s.settings.gistToken && cur.gistToken) s.settings.gistToken = cur.gistToken;
  if(!s.settings.llmBaseUrl && cur.llmBaseUrl) s.settings.llmBaseUrl = cur.llmBaseUrl;
  return s;
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(sanitize(state),null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="xmu-ai-dashboard.json"; a.click();
  toast("已导出 JSON（已自动剔除 Token / API Key）","ok");
}
function importJSON(file){
  const r=new FileReader(); r.onload=()=>{ try{ state=applyExternal(JSON.parse(r.result)); save(); applyTheme(); renderAll(); toast("导入成功","ok"); }catch(e){ toast("导入失败：文件格式错误","err"); } };
  r.readAsText(file);
}
function ghErr(code){
  if(code===401) return "Token 无效或已过期，请重新生成";
  if(code===403) return "权限不足：经典 Token 需勾选 gist 权限，或细粒度 Token 需授予 Gists 访问";
  if(code===404) return "Gist 不存在或无访问权限（Token 缺少 gist 权限时也会返回 404）";
  if(code===422) return "请求不被接受（内容过大等）";
  return "HTTP " + code;
}
async function gistSync(){
  const {gistToken,gistId}=state.settings;
  if(!gistToken){ toast("请先在设置中填写 Gist Token","err"); return; }
  const headers={Authorization:"Bearer "+gistToken,"Accept":"application/vnd.github+json"};
  try{
    // 只上传业务数据，绝不包含 Token / API Key
    const content = JSON.stringify(sanitize(state),null,2);
    let resp;
    if(gistId){
      resp = await fetch("https://api.github.com/gists/"+gistId,{method:"PATCH",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify({files:{"xmu-ai-dashboard.json":{content}}})});
    } else {
      // 固定创建「私有（Secret）Gist」
      resp = await fetch("https://api.github.com/gists",{method:"POST",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify({description:"XMU AI Dashboard data",public:false,files:{"xmu-ai-dashboard.json":{content}}})});
    }
    if(!resp.ok){
      const t = await resp.text().catch(()=>"");
      toast("同步失败 " + ghErr(resp.status) + (t.includes("rate")?"（限流，稍后再试）":""),"err");
      return;
    }
    const j = await resp.json();
    state.settings.gistId = j.id; save();
    toast(gistId ? "已更新到私有 Gist" : "已创建私有 Gist 并保存 ID","ok");
  }catch(e){
    toast("同步失败：" + (e.name==="TypeError" ? "网络/CORS 被拦截——本地 file:// 打开可能受限，建议部署到 https（GitHub Pages）再同步" : e.message),"err");
  }
}
async function gistLoad(){
  const {gistToken,gistId}=state.settings;
  if(!gistToken||!gistId){ toast("需先填写 Token 与 Gist ID","err"); return; }
  try{
    const r=await fetch("https://api.github.com/gists/"+gistId,{headers:{Authorization:"Bearer "+gistToken,"Accept":"application/vnd.github+json"}});
    if(!r.ok){ const t=await r.text().catch(()=>""); toast("载入失败 " + ghErr(r.status) + (t.includes("rate")?"（限流）":""),"err"); return; }
    const j=await r.json();
    const f=j.files["xmu-ai-dashboard.json"]; if(!f){ toast("Gist 中无备份文件","err"); return; }
    state = applyExternal(JSON.parse(f.content)); save(); applyTheme(); renderAll();
    toast("已从 Gist 载入（本地密钥已保留）","ok");
  }catch(e){
    toast("载入失败：" + (e.name==="TypeError" ? "网络/CORS 被拦截——建议部署到 https 后再同步" : e.message),"err");
  }
}

/* =====================================================================
   Modal / 事件绑定
   ===================================================================== */
function openModal(html){ $("#modalBody").innerHTML=html; $("#overlay").classList.add("open"); }
function closeModal(){ $("#overlay").classList.remove("open"); $("#modalBody").innerHTML=""; }

function bindEvents(){
  // 主题
  $("#themeBtn").onclick = toggleTheme;
  // tabs
  $$(".tab").forEach(t=>t.onclick=()=>{ $$(".tab").forEach(x=>x.classList.remove("active")); t.classList.add("active"); $$(".panel").forEach(p=>p.classList.remove("active")); $("#"+t.dataset.tab).classList.add("active"); });
  // topbar
  document.querySelector('[data-action="export"]').onclick = exportJSON;
  document.querySelector('[data-action="import"]').onclick = ()=>$("#fileImport").click();
  $("#fileImport").onchange = e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=""; };
  document.querySelector('[data-action="gistUp"]').onclick = async ()=>{ await gistSync(); };
  document.querySelector('[data-action="gistDown"]').onclick = async ()=>{ await gistLoad(); };
  document.querySelector('[data-action="settings"]').onclick = settingsModal;
  // overlay close
  $("#overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); });
  // 课程勾选（事件委托）
  document.addEventListener("change",e=>{
    const el=e.target;
    if(el.classList.contains("sel")){ if(el.checked) state.courses[el.dataset.code]=true; else delete state.courses[el.dataset.code]; save(); renderSummary(); }
    else if(el.classList.contains("mile-toggle")){ state.milestones[el.dataset.id].done = el.checked; save(); renderAll(); }
    else if(el.classList.contains("prac-report")){ state.milestones[el.dataset.id].report = el.checked; save(); renderMilestones(); }
    else if(el.classList.contains("prac-attach")){ state.milestones[el.dataset.id].attach = el.checked; save(); renderMilestones(); }
    else if(el.classList.contains("teach-sign")){ state.milestones[el.dataset.id].signed = el.checked; save(); renderMilestones(); }
    else if(el.classList.contains("pipe-toggle")){ state.thesis[el.dataset.id]=el.checked; save(); renderThesis(); }
  });
  // 课程搜索 / 过滤
  $("#courseSearch").addEventListener("input",()=>renderCourses());
  $("#filterAI").onclick = ()=>{ state._aiOnly=!state._aiOnly; $("#filterAI").style.opacity=state._aiOnly?"1":".6"; renderCourses(); };
  $("#filterAI").style.opacity = state._aiOnly?"1":".6";
  // 委托点击
  document.addEventListener("click",e=>{
    const el=e.target.closest("[data-action],[data-del-custom],[data-del-paper],[data-edit-paper],[data-del-lecture],[data-step],[data-pstep],[data-prac]");
    if(!el) return;
    if(el.dataset.action){
      const a=el.dataset.action;
      if(a==="addCourse") addCustomCourse();
      else if(a==="timeline") timelineModal();
      else if(a==="addBlock") blockModal();
      else if(a==="ics") exportICS();
      else if(a==="vision") visionModal();
      else if(a==="addLecture") lectureModal();
      else if(a==="addPaper") paperModal();
    }
    else if(el.dataset.delCustom){ delete state.courses[el.dataset.delCustom]; state.custom=state.custom.filter(c=>c.id!==el.dataset.delCustom); save(); renderAll(); }
    else if(el.dataset.delPaper){ state.papers=state.papers.filter(p=>p.id!==el.dataset.delPaper); save(); renderThesis(); }
    else if(el.dataset.editPaper){ paperModal(el.dataset.editPaper); }
    else if(el.dataset.delLecture){ const m=state.milestones.lecture; m.list=m.list.filter(l=>l.id!==el.dataset.delLecture); m.count=m.list.length; save(); renderMilestones(); }
    else if(el.dataset.step){ const [id,i]=el.dataset.step.split(":"); state.milestones[id].step=parseInt(i)+1; save(); renderMilestones(); }
    else if(el.dataset.pstep!==undefined){ state.paperStep=parseInt(el.dataset.pstep); save(); renderThesis(); }
    else if(el.dataset.prac){ const m=state.milestones.practice; m.months=Math.max(0,Math.min(6,(m.months||0)+parseInt(el.dataset.prac))); save(); renderMilestones(); }
    else if(el.classList.contains("course-block")){ blockModal(el.dataset.id); }
  });
  // 关闭按钮
  document.addEventListener("click",e=>{ if(e.target.closest("[data-close]")) closeModal(); });
  // 空闲时段高亮
  $("#freeToggle").onchange = ()=>renderSchedule();
}

function renderAll(){
  applyTheme();
  renderSummary(); renderCourses(); renderSchedule(); renderMilestones(); renderThesis();
}

ensureMile();
renderAll();
bindEvents();
</script>
</body>
